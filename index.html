<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anisha Jain — Chartered Actuary</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #030712;
    --text: #f9fafb;
    --sub: #9ca3af;
    --glass: rgba(17, 24, 39, 0.7);
    --border: rgba(255, 255, 255, 0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background-image: 
      radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.18) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.12) 0px, transparent 50%);
  }
  .card {
    max-width: 760px;
    width: 100%;
    background: var(--glass);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px);
    border-radius: 32px;
    padding: 60px 48px;
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
  }
  .badge {
    display: inline-block;
    padding: 6px 18px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #e0e7ff;
    letter-spacing: 0.05em;
    margin-bottom: 24px;
  }
  h1 {
    font-size: clamp(3rem, 7vw, 4.8rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #ffffff 30%, #818cf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .role {
    font-size: clamp(1.3rem, 3.5vw, 1.8rem);
    color: #c7d2fe;
    font-weight: 400;
    margin-bottom: 28px;
  }
  .statement {
    font-size: 1.15rem;
    line-height: 1.7;
    color: var(--sub);
    max-width: 580px;
    margin: 0 auto 40px;
  }
  .cta-group {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 14px 32px;
    border-radius: 16px;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .btn-gradient {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: #ffffff;
    box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5);
  }
  .btn-gradient:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.7);
  }
  .btn-secondary {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-2px);
  }
  @media (max-width: 640px) {
    .card { padding: 40px 24px; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="badge">FIA · INSTITUTE &amp; FACULTY OF ACTUARIES</div>
  <h1>Anisha Jain</h1>
  <div class="role">Chartered Actuary</div>
  <p class="statement">
    Quantitative risk consulting, advanced pricing models, and corporate treasury analytics.
  </p>
  <div class="cta-group">
    <a href="mailto:anishajain3015@gmail.com" class="btn btn-gradient">Get in touch</a>
    <a href="https://www.linkedin.com/in/anisha-jain-fia-5b268b218/" target="_blank" rel="noopener" class="btn btn-secondary">LinkedIn</a>
  </div>
</div>
</body>
</html>
