:root{--bg:#fff;--alt:#f5f6f8;--tx:#1c2433;--mu:#5b6475;--ac:#1f3a5f;--ln:#dfe3ea;

html{scroll-behavior:smooth;scroll-padding-top:calc(4.5rem + env(safe-area-inset-top,0px))}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 1rem/1.7 var(--sans)}

nav.on{transform:none}
nav b{font:500 1.35rem var(--serif);color:var(--ac)}
nav div{display:flex;gap:1.75rem}
nav a{color:var(--mu);text-decoration:none;font-size:.9rem}
nav a:hover{color:var(--ac)}
#hero{height:100vh;height:100svh;display:grid;place-items:center;text-align:center;background:var(--alt)}
h1{font:500 clamp(3rem,10vw,7rem)/1.05 var(--serif);color:var(--ac);letter-spacing:-.01em}
.rule{width:64px;height:1px;background:var(--ac);margin:1.75rem auto}
.role{font-size:clamp(.95rem,2vw,1.15rem);color:var(--mu);letter-spacing:.14em}
section.w{padding:6rem 1.5rem;max-width:1040px;margin:0 auto}
h2{font:500 clamp(2rem,4.5vw,3rem)/1.15 var(--serif);color:var(--ac);margin-bottom:.75rem}
.sub{color:var(--mu);max-width:58ch;margin-bottom:3rem}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:2.5rem 3rem}
.svc div{border-top:2px solid var(--ac);padding-top:1.1rem}
h3{font:600 1.45rem/1.25 var(--serif);color:var(--tx)}
.svc p{color:var(--mu);font-size:.95rem;margin:.5rem 0 .75rem}.svc ul{font-size:.9rem}
.alt{background:var(--alt)}
.row{display:grid;grid-template-columns:230px 1fr;gap:2rem;padding:2.25rem 0;border-top:1px solid var(--ln)}
.d{color:var(--mu);font-size:.9rem}
.d strong{display:block;font:600 1.3rem var(--serif);color:var(--ac)}
.at{color:var(--ac);font-size:.95rem;margin:.15rem 0 .75rem;font-weight:500}
ul{margin:0;padding-left:1.1rem;color:var(--mu);font-size:.95rem}
li{margin:.3rem 0}
.edu{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:3rem}
.edu>div{border-top:2px solid var(--ac);padding-top:1.1rem}
.edu p{color:var(--mu);font-size:.95rem;margin-top:.4rem}
.ex{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem}
.ex span{font-size:.8rem;border:1px solid var(--ln);background:var(--bg);padding:.1rem .55rem;color:var(--ac)}
.ct{display:grid;grid-template-columns:1.6fr 1fr;gap:3rem;align-items:start}
form{background:var(--bg);border:1px solid var(--ln);padding:2rem;display:grid;gap:1.1rem}
